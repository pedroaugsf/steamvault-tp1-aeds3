# ---------------------------------------------------------------
#  SteamVault — publicação do caderno de trabalho
#  O site é HTML estático, sem build: a pasta site/ vai direto ao ar.
# ---------------------------------------------------------------
[build]
  publish = "site"

# Cabeçalhos de segurança básicos para uma página estática.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# O HTML é revalidado sempre; nada mais precisa de cache agressivo aqui.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
